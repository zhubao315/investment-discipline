<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="投资的纪律 · Agent Skill">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1F44"/>
      <stop offset="1" stop-color="#102A57"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C9A227"/>
      <stop offset="1" stop-color="#E8C84C"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.06"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect x="0" y="0" width="1280" height="360" fill="url(#fade)"/>

  <!-- 背景行情柱（装饰） -->
  <g opacity="0.16" fill="#9FB3D1">
    <rect x="880" y="150" width="10" height="120" rx="3"/>
    <rect x="906" y="120" width="10" height="150" rx="3"/>
    <rect x="932" y="170" width="10" height="100" rx="3"/>
    <rect x="958" y="96"  width="10" height="174" rx="3"/>
    <rect x="984" y="140" width="10" height="130" rx="3"/>
    <rect x="1010" y="70" width="10" height="200" rx="3"/>
    <rect x="1036" y="112" width="10" height="158" rx="3"/>
    <rect x="1062" y="60" width="10" height="210" rx="3"/>
    <rect x="1088" y="104" width="10" height="166" rx="3"/>
    <rect x="1114" y="132" width="10" height="138" rx="3"/>
    <rect x="1140" y="88" width="10" height="182" rx="3"/>
    <rect x="1166" y="150" width="10" height="120" rx="3"/>
  </g>
  <!-- 金色趋势线 -->
  <polyline points="880,250 906,232 932,246 958,206 984,220 1010,178 1036,196 1062,158 1088,176 1114,190 1140,150 1166,168"
            fill="none" stroke="url(#gold)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>

  <!-- 左侧品牌标记 -->
  <g transform="translate(84,86)">
    <rect x="0" y="0" width="52" height="52" rx="12" fill="none" stroke="url(#gold)" stroke-width="3"/>
    <path d="M13 27 L22 36 L40 17" fill="none" stroke="url(#gold)" stroke-width="5"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 标题 -->
  <text x="84" y="214" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Source Han Sans SC',sans-serif"
        font-size="96" font-weight="700" fill="#FFFFFF" letter-spacing="4">投资的纪律</text>
  <text x="88" y="258" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Source Han Sans SC',sans-serif"
        font-size="30" font-weight="500" fill="#C9A227" letter-spacing="6">从情绪交易到纪律复利</text>
  <text x="88" y="304" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC','Source Han Sans SC',sans-serif"
        font-size="24" fill="#9FB3D1" letter-spacing="2">市场不可预测，清单可以执行。</text>

  <!-- 徽标 -->
  <g transform="translate(1000,272)">
    <rect x="0" y="0" width="196" height="42" rx="21" fill="none" stroke="#C9A227" stroke-width="1.5" opacity="0.8"/>
    <text x="98" y="27" text-anchor="middle"
          font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace"
          font-size="17" fill="#E8C84C" letter-spacing="2">AGENT SKILL · v1.1.0</text>
  </g>
</svg>
